name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'apps/fe/**' # Chỉ chạy khi có thay đổi trong thư mục code Frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Cài đặt Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' # Vite yêu cầu Node 20+
        
    - name: Cài đặt thư viện (npm install)
      working-directory: ./apps/fe
      run: npm install
      
    - name: Build ứng dụng (npm run build)
      working-directory: ./apps/fe
      run: npm run build
      
    - name: Cấu hình AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1 # Thay đổi nếu Bucket của bạn ở khu vực khác (ví dụ: us-east-1)
        
    - name: Xóa code cũ và Upload code mới lên S3
      run: aws s3 sync ./apps/fe/dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
      
    - name: Xóa Cache CloudFront (Cập nhật giao diện lập tức)
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
