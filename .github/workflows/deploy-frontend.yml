name: Deploy Frontend to S3 and CloudFront

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/fe/**' # Chỉ chạy khi có thay đổi trong thư mục code Frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Vite yêu cầu Node 20+
        cache: 'pnpm'
        
    - name: Cài đặt thư viện
      run: pnpm install --frozen-lockfile
      
    - name: Build ứng dụng (pnpm build)
      working-directory: ./apps/fe
      env:
        VITE_GOOGLE_CLIENT_ID: "134540927147-avuem4p7a41e2iddu2jqcvq2asl7vhqv.apps.googleusercontent.com"
        VITE_APP_BASE_URL: "https://api.smart-restaurant.id.vn"
        VITE_FRONTEND_BASE_URL: "https://smart-restaurant.id.vn"
        VITE_BANK_ID: "MB"
        VITE_ACCOUNT_NO: "21230907843010"
        VITE_ACCOUNT_NAME: "NHA HANG SMART"
        VITE_TEMPLATE: "compact"
      run: npm run build
      
    - name: Cấu hình AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1 # Thay đổi nếu Bucket của bạn ở khu vực khác (ví dụ: us-east-1)
        
    - name: Xóa code cũ và Upload code mới lên S3
      run: aws s3 sync ./apps/fe/dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
      
    - name: Xóa Cache CloudFront (Cập nhật giao diện lập tức)
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
