name: Deploy Backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/be/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/be/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-restaurant-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-restaurant-backend:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Kéo image mới nhất từ Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-restaurant-backend:latest
            
            # Dừng và xóa container backend cũ (nếu có)
            docker stop smart-restaurant-backend || true
            docker rm smart-restaurant-backend || true
            
            # Khởi chạy container backend mới
            docker run -d \
              --name smart-restaurant-backend \
              -p 3030:3030 \
              --restart unless-stopped \
              --env-file ~/SMART_RESTAURANT_CBD/apps/be/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/smart-restaurant-backend:latest
