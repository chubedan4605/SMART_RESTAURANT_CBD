name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Stage 1-6: Linting, Analysis, Testing
  quality-gate:
    name: Quality Gate & Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar or CodeQL
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false
          
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Lint Frontend & Backend
        run: |
          pnpm --filter frontend lint
          pnpm --filter backend lint || true
          
      - name: Snyk Security Scan (Dependencies)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: true
        
      - name: Snyk Code Scan (SAST)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high
        continue-on-error: true
        
      - name: Run Tests
        run: |
          pnpm --filter frontend test
          pnpm --filter backend test || true

  # Stage 7-8: Build and Security Scan for Backend Docker Image
  container-security:
    name: Container Build & Snyk Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Docker Image
        run: docker build -t smart-restaurant-backend:${{ github.sha }} -f apps/be/Dockerfile .
        
      - name: Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: smart-restaurant-backend:${{ github.sha }}
          args: --file=apps/be/Dockerfile --severity-threshold=high
        continue-on-error: true
